[package]
name = "chronote"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.88"
description = "Animated study timelines with notes, including an embryology demo"
license = "Apache-2.0"
readme = "README.md"
keywords = ["iced", "gui", "timeline", "education", "medicine"]
categories = ["gui", "science"]

[dependencies]
directories = "6.0.0"
iced = { version = "0.14", features = ["canvas", "tokio"] }
log = { version = "0.4.35", features = ["std"] }
opener = "0.9.0"
png = "0.18.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ttf-parser = "0.25.1"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Geometry code converts between f32 and integer week indices on purpose.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# iced's Elm-style `update`/`view` take ownership by convention.
needless_pass_by_value = "allow"
# Hex color codes (`0xRRGGBB`) read best without separators.
unreadable_literal = "allow"
# View helpers return widgets that are always used; the hint is noise.
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.34"
