[package]
name = "embryo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An animated week-by-week timeline of human fetal development"
license = "MIT"
readme = "README.md"
keywords = ["iced", "gui", "pregnancy", "timeline", "education"]
categories = ["gui", "science"]

[dependencies]
iced = { version = "0.14", features = ["canvas", "tokio"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Geometry code converts between f32 and integer week indices on purpose.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# iced's Elm-style `update`/`view` take ownership by convention.
needless_pass_by_value = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
